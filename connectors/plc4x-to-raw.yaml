# Redpanda Connect — renormalise le topic PLC4X `plc.raw` vers le contrat `tags.raw`.
#
# PLC4X émet UN message par job, contenant TOUS ses tags groupés, avec les ALIAS
# définis dans la config du connecteur (pas les adresses physiques) :
#   key   = {"sourceName":"brasserie.ipa","jobName":"scan"}
#   value = {"tags":{"fermenteur.temperature":123,...},"timestamp":1780568826389}
#
# Convention Strata (cf. CLAUDE.md) : le `tag` est un nom MÉTIER hiérarchique
# `site.ligne.machine.mesure`, indépendant du protocole. Les connecteurs sont
# GÉNÉRÉS depuis la base (table devices) : la `source` PLC4X est nommée d'après le
# `base_tag` métier du device, et l'alias de chaque point est son nom RELATIF.
# Le nom métier complet = sourceName + "." + alias. Aucune table codée en dur ici.

input:
  kafka_franz:
    seed_brokers: ["redpanda:9092"]
    topics: ["plc.raw"]
    consumer_group: "strata-plc4x-normalize"

pipeline:
  processors:
    - mapping: |
        # sourceName PLC4X (= base_tag métier du device) dans la CLÉ Kafka.
        let base = meta("kafka_key").parse_json().sourceName.or("usine.inconnu")
        let ts = this.timestamp

        # Éclate l'objet `tags` en un message par point, au contrat Strata.
        root = this.tags.key_values().map_each(kv -> {
          "tag":     $base + "." + kv.key,
          "value":   kv.value,
          "ts":      ($ts / 1000).ts_format("2006-01-02T15:04:05Z07:00", "UTC"),
          "quality": "good",
          "source":  "plc4x"
        })

    # Un message par tag (et non un tableau).
    - unarchive:
        format: json_array

output:
  kafka_franz:
    seed_brokers: ["redpanda:9092"]
    topic: "tags.raw"
    key: '${! json("tag") }'
    compression: none
