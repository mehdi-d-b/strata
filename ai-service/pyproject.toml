[project]
name = "ai-service"
version = "0.1.0"
description = "Microservice IA de Strata (FastAPI + LangGraph) — remplace l'agent fait main de la gateway."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "langgraph>=0.2",
  "langchain-ollama>=0.2",
  "httpx>=0.27",
  # Extraction + découpage PDF structurés (ingest.py) — remplace pypdf +
  # langchain-text-splitters (découpage par taille de caractères, aveugle à la
  # mise en page). Dépendance lourde assumée (torch, ~100 paquets) : coût
  # ponctuel (un modèle de mise en page téléchargé une fois, comme un modèle
  # Ollama), pas un appel cloud — jugé nécessaire après avoir vérifié en direct
  # qu'un découpage naïf dégradait réellement la pertinence du RAG.
  "docling>=2.0",
  # Épinglés explicitement (docling les tire déjà en transitif) pour que
  # [tool.uv.sources] ci-dessous force le wheel CPU sur les deux — sans ces
  # lignes, uv ignore l'override sur une dépendance purement transitive, et
  # torchvision se résout alors depuis pypi.org (ABI différente de torch+cpu),
  # plantant à l'import ("operator torchvision::nms does not exist") — vu en
  # direct après le premier correctif partiel (torch seul).
  "torch",
  "torchvision",
  # Reranker cross-encoder (reranker.py). Déjà tiré par docling, déclaré
  # parce qu'on l'importe désormais directement.
  "transformers>=5.8",
  # Le serveur LangGraph (langgraph-cli[inmem]) sert désormais le chat en
  # continu (front assistant-ui, protocole /threads+/runs/stream) — plus un
  # outil de débogage ponctuel (étape 5), donc plus une dépendance dev-only.
  # CopilotKit (copilotkit, ag-ui-langgraph) retiré : migration vers
  # assistant-ui, protocole LangGraph Platform natif, pas de couche AG-UI.
  "langgraph-cli[inmem]>=0.2",
]

[dependency-groups]
# fpdf2 : génère knowledge-pdfs/manuel-exploitation-brasserie.pdf depuis
# scripts/generate_manual_pdf.py — jamais utilisé par le service en marche,
# uniquement pour reconstruire le manuel après une modification du contenu.
dev = ["fpdf2>=2.7"]

[tool.uv]
package = false

[tool.uv.sources]
# Docling tire torch (mise en page) — sans ça, uv résout le wheel CUDA par
# défaut et embarque des Go de bibliothèques NVIDIA totalement inutiles ici
# (aucun GPU, tout tourne CPU) : observé en direct, image passée de qq centaines
# de Mo à 8,9 Go avant ce correctif.
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
