# Strata — socle Phase 0 : Redpanda + Redpanda Console + TimescaleDB.
# Versions épinglées ; ajuste les tags si un pull échoue (voir hub.docker.com).

name: strata

services:
  redpanda:
    image: redpandadata/redpanda:v24.3.1
    container_name: strata-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
    ports:
      - "18081:18081"   # schema registry
      - "18082:18082"   # pandaproxy (REST)
      - "19092:19092"   # kafka API (externe)
      - "9644:9644"     # admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s

  console:
    image: redpandadata/console:v2.8.1
    container_name: strata-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: strata-timescaledb
    environment:
      POSTGRES_USER: ${TIMESCALE_USER:-strata}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-strata}
      POSTGRES_DB: ${TIMESCALE_DB:-strata}
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./infra/timescale/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-strata} -d ${TIMESCALE_DB:-strata}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # --- Phase 1 : chaîne de données ---------------------------------------

  # Crée le topic normalisé une fois Redpanda prêt, puis se termine.
  topic-init:
    image: redpandadata/redpanda:v24.3.1
    container_name: strata-topic-init
    depends_on:
      redpanda:
        condition: service_healthy
    # Crée tags.raw / tags.cmd, et les topics internes de Kafka Connect (profil
    # plc4x) en cleanup.policy=compact (sinon Connect refuse de démarrer).
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        rpk topic create tags.raw --brokers redpanda:9092 -p 1 -r 1 || true;
        rpk topic create tags.cmd --brokers redpanda:9092 -p 1 -r 1 || true;
        rpk topic create tags.derived --brokers redpanda:9092 -p 1 -r 1 || true;
        rpk topic create _connect-configs --brokers redpanda:9092 -p 1 -r 1 -c cleanup.policy=compact || true;
        rpk topic create _connect-offsets --brokers redpanda:9092 -p 1 -r 1 -c cleanup.policy=compact || true;
        rpk topic create _connect-status --brokers redpanda:9092 -p 1 -r 1 -c cleanup.policy=compact || true
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: strata-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  simulator:
    build: ./simulator
    container_name: strata-simulator
    depends_on:
      mosquitto:
        condition: service_started
      redpanda:
        condition: service_healthy
    environment:
      MQTT_URL: mosquitto
      MQTT_PORT: "1883"
      KAFKA_BROKERS: redpanda:9092
      TICK_HZ: "2.0"
      SPEED: "1.0"
    restart: unless-stopped

  # Redpanda Connect #1 : MQTT -> normalisation -> topic tags.raw
  connect-mqtt-to-raw:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: strata-connect-mqtt
    depends_on:
      redpanda:
        condition: service_healthy
      mosquitto:
        condition: service_started
    command: ["run", "/connect.yaml"]
    volumes:
      - ./connectors/mqtt-to-raw.yaml:/connect.yaml:ro
    restart: unless-stopped

  # Redpanda Connect #2 : topic tags.raw -> sink TimescaleDB
  connect-raw-to-timescale:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: strata-connect-timescale
    depends_on:
      redpanda:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    command: ["run", "/connect.yaml"]
    environment:
      TIMESCALE_USER: ${TIMESCALE_USER:-strata}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-strata}
      TIMESCALE_DB: ${TIMESCALE_DB:-strata}
    volumes:
      - ./connectors/raw-to-timescale.yaml:/connect.yaml:ro
    restart: unless-stopped

  # --- Phase 4 : industriel via PLC4X (profil optionnel `plc4x`) ----------
  # Démarre uniquement avec : docker compose --profile plc4x up -d
  # C'est le SEUL container JVM ; le stack par défaut reste sans JVM.
  kafka-connect:
    build: ./infra/kafka-connect
    container_name: strata-kafka-connect
    profiles: ["plc4x"]
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8083:8083"   # API REST de Kafka Connect
    environment:
      CONNECT_BOOTSTRAP_SERVERS: redpanda:9092
      CONNECT_GROUP_ID: strata-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_PLUGIN_PATH: /usr/share/java
    restart: unless-stopped

  # Redpanda Connect : renormalise plc.raw (format PLC4X) -> tags.raw (contrat Strata).
  connect-plc4x-to-raw:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: strata-connect-plc4x
    profiles: ["plc4x"]
    depends_on:
      redpanda:
        condition: service_healthy
    command: ["run", "/connect.yaml"]
    volumes:
      - ./connectors/plc4x-to-raw.yaml:/connect.yaml:ro
    restart: unless-stopped

  # Gateway temps réel : Redpanda tags.raw -> WebSocket, + historique REST.
  gateway:
    build: ./gateway
    container_name: strata-gateway
    depends_on:
      redpanda:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      PG_DSN: "postgres://${TIMESCALE_USER:-strata}:${TIMESCALE_PASSWORD:-strata}@timescaledb:5432/${TIMESCALE_DB:-strata}"
      PORT: "3001"
      # Mot de passe du compte admin créé au 1er boot (cf. .env). À changer en prod.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # La gateway crée ELLE-MÊME le compte technique assistant-service au boot
      # (seedAssistantService) — même valeur que sous ai-service:, sinon le
      # compte créé ici et le mot de passe qu'ai-service essaie ne correspondent
      # jamais. Oubliée ici lors de l'ajout initial, trouvée en testant en direct.
      AI_SERVICE_PASSWORD: ${AI_SERVICE_PASSWORD:-change-me-en-prod-assistant}
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
      # API REST de Kafka Connect (profil plc4x) pour déployer les connecteurs générés.
      KAFKA_CONNECT_URL: "http://kafka-connect:8083"
      # Assistant IA local (profil `ai`) : runtime Ollama + modèle. Absent = chat désactivé.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-qwen2.5:7b}
      # Proxy vers le serveur LangGraph natif d'ai-service (front assistant-ui).
      AI_SERVICE_URL: "http://ai-service:8000"
    ports:
      - "3001:3001"
    restart: unless-stopped

  # --- RisingWave : moteur de calcul temps réel (profil optionnel `risingwave`) ---
  # Base de données de streaming (Rust, sans JVM). Consomme tags.raw, calcule des
  # vues matérialisées (anomalies, dérivés) et sink les résultats vers Redpanda.
  # Démarre uniquement avec : docker compose --profile risingwave up -d
  risingwave:
    image: risingwavelabs/risingwave:latest
    container_name: strata-risingwave
    profiles: ["risingwave"]
    command: single_node
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "4566:4566"   # endpoint SQL (wire PostgreSQL)
    volumes:
      - risingwave-data:/root/.risingwave
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'printf > /dev/tcp/127.0.0.1/4566'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # --- Assistant IA local (profil optionnel `ai`) -------------------------
  # Runtime LLM open-source, 100% local (aucun cloud). Expose une API HTTP
  # (compatible OpenAI sur /v1) que la gateway appelle. Le modèle se charge via
  # `docker compose exec ollama ollama pull qwen2.5:3b`. GPU auto-détecté si dispo
  # (souvent CPU en pratique). Démarre avec : docker compose --profile ai up -d
  ollama:
    image: ollama/ollama:latest
    container_name: strata-ollama
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  # Microservice IA (FastAPI + LangGraph) : à terme, remplace l'agent fait main
  # de la gateway (gateway/src/assistant.ts). N'a AUCUN accès direct à Postgres/
  # Kafka — il parle à la gateway en HTTP, comme n'importe quel client externe.
  # Sur ce Mac, Ollama tourne nativement (hors Docker) pour le GPU Metal ; d'où
  # OLLAMA_URL=host.docker.internal, même schéma que le service `gateway`.
  ai-service:
    build: ./ai-service
    container_name: strata-ai-service
    profiles: ["ai"]
    depends_on:
      gateway:
        condition: service_started
    environment:
      GATEWAY_URL: "http://gateway:3001"
      # Compte de service dédié, lecture seule. Il ne partage JAMAIS le secret
      # admin ; les actions confirmées sont toujours exécutées par la session
      # navigateur de l'opérateur.
      AI_SERVICE_USERNAME: assistant-service
      # Le défaut ne sert qu'au démarrage local ; .env.example fournit une valeur
      # dédiée. En production, AI_SERVICE_PASSWORD doit être un secret distinct.
      AI_SERVICE_PASSWORD: ${AI_SERVICE_PASSWORD:-change-me-en-prod-assistant}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      # Var dédiée (pas ASSISTANT_MODEL, réservée à la gateway) : sinon
      # ASSISTANT_MODEL=qwen2.5:14b dans .env écraserait silencieusement ce
      # défaut. qwen2.5:7b choisi ici après tests de tool-calling (2026-07-17) :
      # fiable en pratique via LangGraph/ChatOllama, contrairement à mistral:7b
      # (trop sensible à la formulation exacte) — et même famille que le 14b de
      # prod, donc le comportement de tool-calling reste comparable.
      AI_SERVICE_MODEL: ${AI_SERVICE_MODEL:-qwen2.5:7b}
    # Pas de port hôte : le serveur LangGraph ne doit être joignable que par la
    # gateway, qui est l'unique frontière d'authentification de l'application.
    restart: unless-stopped

volumes:
  redpanda-data:
  timescale-data:
  risingwave-data:
  ollama-data:
